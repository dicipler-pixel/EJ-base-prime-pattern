name: Lean proofs

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Pack integrity (every file matches 05-handoff/manifest.json)
        run: python3 05-handoff/check_pack.py

      - name: Install Lean (elan)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Download pre-built Mathlib
        working-directory: 07-lean-package
        run: lake exe cache get

      - name: Build the proofs
        working-directory: 07-lean-package
        run: lake build 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Check the output against EXPECTED_OUTPUT.txt
        working-directory: 07-lean-package
        run: |
          if grep -q sorryAx "$RUNNER_TEMP/build.log"; then echo "A proof uses sorry"; exit 1; fi
          grep -q "Build completed successfully" "$RUNNER_TEMP/build.log"
          grep "^info:" "$RUNNER_TEMP/build.log" \
            | sed 's/^info: EJ\/\([A-Za-z]*\)\.lean:[0-9]*:0: /\1: /' | sort > "$RUNNER_TEMP/got.txt"
          grep -v "^Build completed" EXPECTED_OUTPUT.txt | sort > "$RUNNER_TEMP/want.txt"
          diff "$RUNNER_TEMP/want.txt" "$RUNNER_TEMP/got.txt"
          echo "All $(wc -l < "$RUNNER_TEMP/want.txt") result lines match; no sorry."
