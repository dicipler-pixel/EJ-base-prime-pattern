<style>
:root{--bg:#fbfaf7;--ink:#1c1c1e;--muted:#5d5d63;--line:#dedad2;--panel:#ffffff;--accent:#8a5a00;--fig:#ffffff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#16171a;--ink:#ebebed;--muted:#a6a6ad;--line:#36373d;--panel:#1f2024;--accent:#e0b44a;--fig:#f4f3ef}}
:root[data-theme="dark"]{--bg:#16171a;--ink:#ebebed;--muted:#a6a6ad;--line:#36373d;--panel:#1f2024;--accent:#e0b44a;--fig:#f4f3ef}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);max-width:46em;margin:0 auto;padding:2.2em 16px 4em;
  font:17px/1.62 Georgia,"Times New Roman",serif;hyphens:auto;overflow-wrap:break-word}
header#title-block-header{text-align:center;margin-bottom:2em}
h1.title{font-size:1.85em;line-height:1.25;margin:.2em 0}
p.author{margin:.3em 0;color:var(--ink)} p.date{color:var(--muted)}
h1{font-size:1.4em;margin:1.8em 0 .5em} h2{font-size:1.15em;margin:1.5em 0 .4em} h3{font-size:1.05em}
h1,h2,h3{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.3}
.header-section-number{color:var(--muted);margin-right:.4em}
a{color:var(--accent)}
.abstract{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:.3em 1.1em;margin:1.5em 0}
.abstract-title{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-weight:700;margin-top:.8em}
.theorem,.proposition,.corollary,.lemma,.definition,.remark{margin:1.1em 0}
.theorem,.proposition,.corollary,.lemma{border-left:3px solid var(--accent);padding:.1em 0 .1em .9em}
.definition{border-left:3px solid var(--line);padding:.1em 0 .1em .9em}
.proof{margin:.6em 0 1.2em;color:var(--ink)}
table{border-collapse:collapse;margin:1em auto;font-size:.93em;display:block;overflow-x:auto;max-width:100%;width:max-content}
th,td{border-bottom:1px solid var(--line);padding:.3em .6em;vertical-align:top}
thead th{border-bottom:2px solid var(--ink)}
figure{margin:1.6em 0;text-align:center}
figure img{max-width:100%;height:auto;background:var(--fig);border-radius:6px;padding:4px}
figcaption{font-size:.92em;color:var(--muted);text-align:left;margin-top:.5em}
.center{text-align:center} .center table{margin-left:auto;margin-right:auto}
math[display="block"]{display:block;overflow-x:auto;overflow-y:hidden;max-width:100%;padding:.2em 0}
math:not([display="block"]){display:inline-block;max-width:100%;overflow-x:auto;overflow-y:hidden;vertical-align:middle}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.88em}
svg.wheel{width:260px;max-width:100%;height:auto;display:inline-block;vertical-align:middle;margin:.5em 1em}
.wh-ring{fill:none;stroke:var(--muted);stroke-width:1.2;opacity:.6}
.wh-node{fill:var(--panel);stroke:var(--ink);stroke-width:1.2}
.wh-dash{stroke-dasharray:3 2}
.wh-grey{fill:#bdbdbd} .wh-base{fill:#e6e6e6}
.wh-t{font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.wh-grey+.wh-t,.wh-base+.wh-t{fill:#111}
.wh-arrow{fill:none;stroke:var(--muted);stroke-width:1.3} .wh-fill{fill:var(--muted)}
.wh-small{font:12px -apple-system,sans-serif;fill:var(--muted);text-anchor:middle}
ol li{margin:.3em 0}
</style>
